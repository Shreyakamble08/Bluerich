<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLUERICH · Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy-950: #06132e;
            --navy-900: #071b49;
            --navy-800: #0b2a60;
            --navy-700: #123b78;
            --cyan: #39a9d6;
            --navy-metallic: linear-gradient(135deg, #06132e 0%, #0b2a60 45%, #071b49 65%, #123b78 100%);
            --metallic: linear-gradient(135deg, #ffffff 0%, #f0f4f8 50%, #e8eef4 100%);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: min(1140px, calc(100% - 32px));
            margin-inline: auto;
        }

        /* =========================================================
           SITE HEADER
           ========================================================= */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 9999;
            width: 100%;
            background:
                radial-gradient(circle at 50% 32%,
                    rgba(255, 255, 255, 0.98),
                    rgba(255, 255, 255, 0.35) 40%,
                    transparent 68%),
                var(--metallic);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 10px 30px rgba(16, 24, 40, 0.08),
                inset 0 1px rgba(255, 255, 255, 0.95);
        }

        .site-header::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(57, 169, 214, 0.08);
            filter: blur(45px);
            pointer-events: none;
        }

        /* ===== TOP ROW (logo + nav + hamburger) ===== */
        .site-header .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        /* ===== LOGO ===== */
        .logo-link {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            text-decoration: none;
        }

        .logo-frame {
            width: 58px;
            height: 58px;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #0b2a60, #06132e);
            box-shadow:
                0 5px 16px rgba(6, 19, 46, 0.30),
                inset 0 1px 1px rgba(255, 255, 255, 0.18),
                inset 0 -1px 2px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-frame .brand-logo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 9px;
            transform: scale(1.25);
            transform-origin: center center;
        }

        /* ===== DESKTOP NAV ===== */
        .site-header .desktop-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-header .desktop-nav a {
            padding: 10px 14px;
            border-radius: 10px;
            color: #475467;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.25s ease;
            white-space: nowrap;
        }

        .site-header .desktop-nav a:hover {
            color: var(--navy-900);
            background: rgba(7, 27, 73, 0.06);
        }

        .site-header .desktop-nav .nav-cta {
            color: white !important;
            background: var(--navy-metallic);
            box-shadow: 0 8px 18px rgba(7, 27, 73, 0.16);
        }

        .site-header .desktop-nav .nav-cta:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #0b2a60, #06132e);
        }

        /* ===== HAMBURGER ===== */
        .site-header .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(7, 27, 73, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            transition: 0.25s ease;
            flex-shrink: 0;
        }

        .site-header .menu-toggle:hover {
            background: rgba(7, 27, 73, 0.05);
        }

        .site-header .menu-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            border-radius: 999px;
            background: var(--navy-900);
            transition: 0.3s ease;
        }

        /* =========================================================
           MOBILE MENU — sits BELOW the top row
           ========================================================= */
        .site-header .mobile-menu {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid rgba(7, 27, 73, 0.06);
            flex-direction: column;
        }

        .site-header .mobile-menu a {
            display: block;
            padding: 14px 15px;
            margin-top: 5px;
            border-radius: 10px;
            color: #475467;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .site-header .mobile-menu a:hover {
            color: var(--navy-900);
            background: rgba(7, 27, 73, 0.06);
        }

        .site-header .mobile-menu .mobile-cta {
            margin-top: 10px;
            color: white;
            text-align: center;
            background: var(--navy-metallic);
            box-shadow: 0 8px 18px rgba(7, 27, 73, 0.14);
        }

        /* ===== MOBILE OPEN STATE ===== */
        .site-header.menu-open .mobile-menu {
            display: flex;
        }

        .site-header.menu-open .menu-toggle span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .site-header.menu-open .menu-toggle span:nth-child(2) {
            opacity: 0;
        }

        .site-header.menu-open .menu-toggle span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* =========================================================
           RESPONSIVE BREAKPOINTS
           ========================================================= */

        @media (max-width: 900px) {
            .site-header .desktop-nav {
                display: none;
            }

            .site-header .menu-toggle {
                display: flex;
            }

            .site-header .header-inner {
                min-height: 70px;
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            .logo-frame {
                width: 56px;
                height: 56px;
                border-radius: 11px;
            }

            .logo-frame .brand-logo {
                border-radius: 8px;
                transform: scale(1.2);
            }
        }

        @media (max-width: 620px) {
            .container {
                width: min(1140px, calc(100% - 24px));
            }

            .site-header .header-inner {
                min-height: 66px;
            }

            .logo-frame {
                width: 54px;
                height: 54px;
                border-radius: 10px;
            }

            .logo-frame .brand-logo {
                border-radius: 7px;
                transform: scale(1.18);
            }

            .site-header .menu-toggle {
                width: 46px;
                height: 46px;
            }

            .site-header .mobile-menu {
                padding-left: 14px;
                padding-right: 14px;
                padding-bottom: 16px;
            }

            .site-header .mobile-menu a {
                padding: 13px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .logo-frame {
                width: 48px;
                height: 48px;
                border-radius: 9px;
            }

            .logo-frame .brand-logo {
                border-radius: 6px;
                transform: scale(1.15);
            }

            .site-header .menu-toggle {
                width: 42px;
                height: 42px;
                border-radius: 10px;
            }

            .site-header .menu-toggle span {
                width: 18px;
            }

            .site-header .mobile-menu a {
                padding: 12px 12px;
                font-size: 0.85rem;
            }
        }

        /* ===== DEMO CONTENT (for preview only) ===== */
        .demo-content {
            padding: 40px 0;
        }

        .demo-content h1 {
            font-size: 1.5rem;
            color: #0b1830;
            margin-bottom: 12px;
        }

        .demo-content p {
            color: #667085;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <!-- ============================================================
         SITE HEADER
         ============================================================ -->
    <header class="site-header" id="siteHeader">

        <!-- TOP ROW: logo + nav + hamburger -->
        <div class="container header-inner">

            <!-- LOGO -->
            <a href="/index.html" class="logo-link">
                <div class="logo-frame">
                    <img src="/IMAGES/logo.png" alt="BLUERICH" class="brand-logo" />
                </div>
            </a>

            <!-- DESKTOP NAV -->
            <nav class="desktop-nav" aria-label="Main navigation">
                <a href="/product.html">Product</a>
                <a href="/index.html#distributor">Distributors</a>
                <a href="/index.html#careers">Careers</a>
                <a href="/product.html" class="nav-cta">Buy Now</a>
            </nav>

            <!-- HAMBURGER -->
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="mobileMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <!-- MOBILE MENU — outside .header-inner so it stacks below the top row -->
        <div class="container">
            <div class="mobile-menu" id="mobileMenu">
                <a href="/product.html">Product</a>
                <a href="/index.html#distributor">Distributors</a>
                <a href="/index.html#careers">Careers</a>
                <a href="/product.html" class="mobile-cta">Buy Now</a>
            </div>
        </div>

    </header>

  

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script>
        (function () {
            var header = document.getElementById('siteHeader');
            var menuToggle = document.getElementById('menuToggle');
            var mobileMenu = document.getElementById('mobileMenu');

            if (!header || !menuToggle || !mobileMenu) return;

            // Toggle mobile menu
            menuToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                var isOpen = header.classList.toggle('menu-open');
                menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                menuToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
            });

            // Close menu when a link is clicked
            mobileMenu.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    header.classList.remove('menu-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.setAttribute('aria-label', 'Open navigation menu');
                });
            });

            // Close on Escape key
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && header.classList.contains('menu-open')) {
                    header.classList.remove('menu-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.setAttribute('aria-label', 'Open navigation menu');
                }
            });

            // Close when clicking outside header
            document.addEventListener('click', function (event) {
                if (header.classList.contains('menu-open') && !header.contains(event.target)) {
                    header.classList.remove('menu-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.setAttribute('aria-label', 'Open navigation menu');
                }
            });

            // Auto-close on resize above the breakpoint
            window.addEventListener('resize', function () {
                if (window.innerWidth > 900 && header.classList.contains('menu-open')) {
                    header.classList.remove('menu-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.setAttribute('aria-label', 'Open navigation menu');
                }
            });
        })();
    </script>

</body>
</html>
